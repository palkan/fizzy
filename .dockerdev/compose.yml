x-app: &app
  build:
    context: .
    args:
      RUBY_VERSION: '3.4.7'
  image: vova-fizzy-dev:1.0.0
  working_dir: ${PWD}
  environment: &env
    RAILS_ENV: ${RAILS_ENV:-}
    DATABASE_ADAPTER: ${DATABASE_ADAPTER:-sqlite}
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    MYSQL_USER: root
    MYSQL_PASSWORD: root
  tmpfs:
    - /tmp
    - ${PWD}/tmp/pids

x-backend: &backend
  <<: *app
  stdin_open: true
  tty: true
  volumes:
    - ${PWD}:/${PWD}:cached
    - bundle:/usr/local/bundle
    - rails_cache:/${PWD}/tmp/cache
    - assets:/${PWD}/public/assets
    - history:/usr/local/hist
    - claude:/root/.claude
    - ./.claude.json:/root/.claude.json
    - ./.bashrc:/root/.bashrc:ro
  environment: &backend_environment
    <<: *env
    MALLOC_ARENA_MAX: 2
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    BOOTSNAP_CACHE_DIR: /usr/local/bundle/_bootsnap
    XDG_DATA_HOME: /${PWD}/tmp/cache
    HISTFILE: /usr/local/hist/.bash_history
    IRB_HISTFILE: /usr/local/hist/.irb_history
    EDITOR: vi
    CLAUDE_CODE_TMPDIR: /root/.claude/__tmp__
  depends_on:
    mysql:
      condition: service_healthy

services:
  rails:
    <<: *backend
    command: bundle exec rails

  web:
    <<: *backend
    command: bundle exec rails server -b 0.0.0.0 -p 3006
    ports:
      - '3006:3006'

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    ports:
      - '3306'
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bundle:
  history:
  rails_cache:
  assets:
  claude:
  mysql_data:
